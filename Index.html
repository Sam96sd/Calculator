<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تسوية الحسابات - GitHub Sync</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --danger: #f87171;
            --border: #334155;
            --success: #34d399;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .config-box {
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .status-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 8px;
            text-align: center;
            background: #334155;
            color: var(--text);
        }
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .card h3 { margin: 0 0 8px; font-size: 0.95rem; color: #94a3b8; }
        .card .amount { font-size: 1.4rem; font-weight: bold; }
        .total-card {
            grid-column: span 2;
            background: #1e1b4b;
            border-color: #4338ca;
        }
        .form {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        select, input, button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 0.95rem;
        }
        button.btn-add {
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button.btn-add:disabled { opacity: 0.5; cursor: not-allowed; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 8px;
        }
        th, td {
            padding: 8px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }
        .del-btn {
            background: transparent;
            color: var(--danger);
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status-badge">جاري التحقق من إعدادات المزامنة...</div>

    <!-- إعدادات الربط مع GitHub -->
    <details class="config-box" id="configSection">
        <summary style="cursor: pointer; color: var(--accent); font-weight: bold;">⚙️ إعدادات الربط مع GitHub (اضغط للتعديل)</summary>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
            <input type="text" id="ghUsername" placeholder="اسم المستخدم على GitHub (Username)">
            <input type="text" id="ghRepo" placeholder="اسم المستودع (Repository Name)">
            <input type="password" id="ghToken" placeholder="رمز الوصول (Personal Access Token)">
            <button class="btn-add" onclick="saveConfig()">حفظ والاتصال</button>
        </div>
    </details>

    <div class="cards">
        <div class="card total-card">
            <h3>التوتال الكلي في الحساب</h3>
            <div class="amount" id="totalVal">0.00 درهم</div>
        </div>
        <div class="card">
            <h3>رصيد سامر</h3>
            <div class="amount" id="samerVal">0.00 درهم</div>
        </div>
        <div class="card">
            <h3>رصيد محمود</h3>
            <div class="amount" id="mahmoudVal">0.00 درهم</div>
        </div>
    </div>

    <div class="form">
        <select id="opType" onchange="toggleFields()">
            <option value="samer_in">حوالة واردة لسامر (+)</option>
            <option value="mahmoud_in">حوالة واردة لمحمود (+)</option>
            <option value="joint_in">حوالة واردة مشتركة (+)</option>
            <option value="samer_out">خصم / مصروف من سامر (-)</option>
            <option value="mahmoud_out">خصم / مصروف من محمود (-)</option>
        </select>
        <input type="number" id="amount" placeholder="المبلغ الكلي بالدرهم" step="any">
        <input type="number" id="samerShare" placeholder="حصة سامر من المبلغ المشترك" step="any" style="display: none;">
        <input type="text" id="desc" placeholder="البيان / ملاحظة (اختياري)">
        <button class="btn-add" id="submitBtn" onclick="addEntry()">إضافة الحركة ومزامنتها</button>
    </div>

    <div class="card" style="text-align: right;">
        <h3 style="margin: 0 0 8px;">سجل الحركات</h3>
        <table>
            <thead>
                <tr>
                    <th>البيان</th>
                    <th>المبلغ</th>
                    <th>التفصيل</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>
</div>

<script>
    let appData = { baseSamer: 24668.28, baseMahmoud: 124.22, entries: [] };
    let fileSha = ''; // مطلوب من قبل GitHub API لتحديث الملف

    function setStatus(text, color) {
        const el = document.getElementById('status');
        el.innerText = text;
        if (color) el.style.color = color;
    }

    function toggleFields() {
        const type = document.getElementById('opType').value;
        document.getElementById('samerShare').style.display = (type === 'joint_in') ? 'block' : 'none';
    }

    function saveConfig() {
        const u = document.getElementById('ghUsername').value.trim();
        const r = document.getElementById('ghRepo').value.trim();
        const t = document.getElementById('ghToken').value.trim();
        if (!u || !r || !t) return alert('يرجى ملء جميع بيانات GitHub');

        localStorage.setItem('gh_sync_u', u);
        localStorage.setItem('gh_sync_r', r);
        localStorage.setItem('gh_sync_t', t);
        document.getElementById('configSection').removeAttribute('open');
        fetchFromGitHub();
    }

    // جلب البيانات من ملف data.json عبر API
    async function fetchFromGitHub() {
        const u = localStorage.getItem('gh_sync_u');
        const r = localStorage.getItem('gh_sync_r');
        const t = localStorage.getItem('gh_sync_t');

        if (!u || !r || !t) {
            setStatus('⚠️ يرجى إدخال إعدادات GitHub من القائمة أدناه لتفعيل المزامنة', 'var(--accent)');
            document.getElementById('configSection').setAttribute('open', 'true');
            return;
        }

        setStatus('جاري تحميل البيانات من GitHub...', 'var(--text)');
        try {
            const res = await fetch(`https://api.github.com/repos/${u}/${r}/contents/data.json`, {
                headers: {
                    'Authorization': `Bearer ${t}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!res.ok) throw new Error('فشل جلب الملف. تأكد من صحة الـ Token واسم المستودع وجود ملف data.json');

            const json = await res.json();
            fileSha = json.sha; // حفظ الـ SHA للمستند الحالي
            const decodedContent = decodeURIComponent(escape(atob(json.content)));
            appData = JSON.parse(decodedContent);

            updateView();
            setStatus('✓ متصل بالسحابة ومتزامن مع GitHub', 'var(--success)');
        } catch (err) {
            setStatus('❌ خطأ: ' + err.message, 'var(--danger)');
        }
    }

    // كتابة وحفظ البيانات في data.json عبر API
    async function syncToGitHub() {
        const u = localStorage.getItem('gh_sync_u');
        const r = localStorage.getItem('gh_sync_r');
        const t = localStorage.getItem('gh_sync_t');

        setStatus('جاري حفظ التغييرات على GitHub...', 'var(--accent)');
        document.getElementById('submitBtn').disabled = true;

        try {
            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(appData, null, 2))));
            const res = await fetch(`https://api.github.com/repos/${u}/${r}/contents/data.json`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${t}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'تحديث الحسابات من التطبيق',
                    content: contentEncoded,
                    sha: fileSha
                })
            });

            if (!res.ok) throw new Error('فشل حفظ البيانات على GitHub');

            const json = await res.json();
            fileSha = json.content.sha;
            setStatus('✓ تم الحفظ بنجاح على GitHub', 'var(--success)');
        } catch (err) {
            setStatus('❌ خطأ في الحفظ: ' + err.message, 'var(--danger)');
        } finally {
            document.getElementById('submitBtn').disabled = false;
        }
    }

    function updateView() {
        let curSamer = appData.baseSamer;
        let curMahmoud = appData.baseMahmoud;

        appData.entries.forEach(e => {
            if (e.type === 'samer_in') curSamer += e.amt;
            if (e.type === 'mahmoud_in') curMahmoud += e.amt;
            if (e.type === 'samer_out') curSamer -= e.amt;
            if (e.type === 'mahmoud_out') curMahmoud -= e.amt;
            if (e.type === 'joint_in') {
                curSamer += e.samerPart;
                curMahmoud += (e.amt - e.samerPart);
            }
        });

        document.getElementById('samerVal').innerText = curSamer.toFixed(2) + ' د.إ';
        document.getElementById('mahmoudVal').innerText = curMahmoud.toFixed(2) + ' د.إ';
        document.getElementById('totalVal').innerText = (curSamer + curMahmoud).toFixed(2) + ' د.إ';

        const tbody = document.getElementById('logBody');
        tbody.innerHTML = '';
        appData.entries.forEach((e, idx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${e.desc || '-'}</td>
                <td>${e.amt.toFixed(2)}</td>
                <td>${e.detail}</td>
                <td><button class="del-btn" onclick="removeEntry(${idx})">×</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function addEntry() {
        const type = document.getElementById('opType').value;
        const amt = parseFloat(document.getElementById('amount').value);
        const desc = document.getElementById('desc').value.trim();
        const samerPart = parseFloat(document.getElementById('samerShare').value) || 0;

        if (isNaN(amt) || amt <= 0) return alert('يرجى إدخال مبلغ صالح');
        if (type === 'joint_in' && (samerPart < 0 || samerPart > amt)) return alert('يرجى التحقق من حصة سامر');

        let detail = '';
        if (type === 'samer_in') detail = 'لسامر';
        if (type === 'mahmoud_in') detail = 'لمحمود';
        if (type === 'samer_out') detail = 'خصم سامر';
        if (type === 'mahmoud_out') detail = 'خصم محمود';
        if (type === 'joint_in') detail = `مشترك (${samerPart} لسامر)`;

        appData.entries.push({ type, amt, desc, samerPart, detail });
        updateView();
        await syncToGitHub();

        document.getElementById('amount').value = '';
        document.getElementById('samerShare').value = '';
        document.getElementById('desc').value = '';
    }

    async function removeEntry(index) {
        if (!confirm('هل تريد حذف هذه الحركة؟')) return;
        appData.entries.splice(index, 1);
        updateView();
        await syncToGitHub();
    }

    // تعبئة البيانات مسبقاً إذا كانت موجودة
    document.getElementById('ghUsername').value = localStorage.getItem('gh_sync_u') || '';
    document.getElementById('ghRepo').value = localStorage.getItem('gh_sync_r') || '';
    document.getElementById('ghToken').value = localStorage.getItem('gh_sync_t') || '';

    fetchFromGitHub();
</script>
</body>
</html>
